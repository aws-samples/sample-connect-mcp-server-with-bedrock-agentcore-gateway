# ~~ Generated by projen. To modify, edit .projenrc.py and run "npx projen".

[project]
name = "agentcore_with_x402"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "aws-cdk-lib>=2.1.0,<3.0.0",
  "cdk-nag>=2.37.55,<3",
  "constructs>=10.5.1,<11.0.0",
  "httpx>=0.28.1,<1"
]

  [[project.authors]]
  name = "AWS GCR Web3"
  email = "opensource@amazon.com"

[dependency-groups]
dev = [
  "auto-changelog",
  "bandit",
  "bedrock-agentcore",
  "boto3",
  "claude-agent-sdk",
  "coverage",
  "defusedxml",
  "fastapi",
  "httpx",
  "hypothesis",
  "moto[dynamodb]",
  "mypy",
  "pre-commit",
  "projen==0.103.12",
  "pytest",
  "pytest-cov",
  "pytest-xdist",
  "pyyaml==6.0.3",
  "ruff",
  "semgrep",
  "typeguard==2.13.3"
]
adversarial = [ "mutmut" ]

[tool.uv]
no-binary-package = [ "claude-agent-sdk" ]

[tool.ruff]
line-length = 100
target-version = "py313"

  [tool.ruff.lint]
  select = [ "E", "F", "S", "B", "I", "C90", "RUF" ]
  ignore = [ "RUF001", "RUF002", "RUF003" ]

    [tool.ruff.lint.mccabe]
    max-complexity = 15

    [tool.ruff.lint.per-file-ignores]
    "tests/**" = [ "S101", "S105", "S106", "C901" ]
    "scripts/**" = [ "C901" ]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_unused_ignores = true

  [[tool.mypy.overrides]]
  module = [ "aws_cdk.*", "jsii.*", "constructs.*", "cdk_nag.*" ]
  follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = [ "tests" ]
addopts = "-q --junitxml=report.xml"
pythonpath = [ "." ]

[tool.coverage.run]
branch = true
source = [ "src" ]
