# Install with `npx projen install-hooks`.
# `npx projen run-hooks` is the deliberate all-files audit.
# The backend test suite remains an explicit `npx projen test` check before pushing.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(.projen/|\.env/|cdk\.out/|cdk\.json|pyproject\.toml|pyrightconfig\.json|\.gitlab-ci\.yml|\.gitattributes|\.gitignore|requirements.*\.txt)
      - id: end-of-file-fixer
        exclude: ^(.projen/|\.env/|cdk\.out/|cdk\.json|pyproject\.toml|pyrightconfig\.json|\.gitlab-ci\.yml|\.gitattributes|\.gitignore|requirements.*\.txt)
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
  - repo: local
    hooks:
      # Every local hook below runs its tool through `uv run --no-sync`, NOT bare on PATH.
      #
      # Bare names can pick up globally installed versions instead of the locked project tools.
      # `--no-sync` keeps a commit from reinstalling packages or touching the lock file.
      - id: ruff-format
        name: ruff format check
        entry: uv run --no-sync ruff format
        args: ["--check"]
        language: system
        types: [python]
      - id: ruff-check
        name: ruff lint
        entry: uv run --no-sync ruff check
        language: system
        types: [python]
      # `pass_filenames: false` is required, not an optimisation: mypy given a subset of files
      # resolves imports differently and reports errors the whole-project run does not.
      - id: mypy
        name: mypy type check
        entry: uv run --no-sync mypy
        args: [".projenrc.py", "app.py", "infra", "scripts", "src"]
        language: system
        types: [python]
        pass_filenames: false
      - id: bandit
        name: bandit security scan
        # LOW findings are false-positive-heavy for resource names and empty placeholders.
        entry: uv run --no-sync bandit
        args: ["-q", "--severity-level", "medium"]
        language: system
        types: [python]
        exclude: ^tests/
      - id: semgrep
        name: semgrep security scan
        entry: scripts/validate/run-semgrep.sh
        args: ["--error", "--config=.semgrep.yml", "--quiet"]
        language: system
        files: \.(py|js|jsx|ts|tsx)$
        exclude: ^tests/
